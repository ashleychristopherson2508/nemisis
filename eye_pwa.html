<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <title>Nemesis Eye V13 - Stable Textured Wake</title>

    <style>
        :root {
            --eye-width: min(95vw, 1500px);
            --eye-height: min(88vh, 1200px);
            --eye-height: min(88dvh, 1200px);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #080000 0%, #000 70%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 99;
            pointer-events: none;
            background: radial-gradient(
                circle,
                transparent 25%,
                rgba(0, 0, 0, 0.55) 70%,
                rgba(0, 0, 0, 0.95) 100%
            );
        }

        .fog,
        .fog2,
        .fog3 {
            position: fixed;
            inset: -30%;
            pointer-events: none;
        }

        .fog {
            background: radial-gradient(
                circle at 20% 50%,
                rgba(255, 255, 255, 0.03),
                transparent 25%
            );
            animation: fog-one 90s linear infinite;
        }

        .fog2 {
            background: radial-gradient(
                circle at 70% 30%,
                rgba(255, 255, 255, 0.02),
                transparent 30%
            );
            animation: fog-two 130s linear infinite;
        }

        .fog3 {
            background: radial-gradient(
                circle at 50% 70%,
                rgba(255, 255, 255, 0.015),
                transparent 35%
            );
            animation: fog-three 160s linear infinite;
        }

        #embers {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        .eye {
            position: relative;
            width: var(--eye-width);
            height: var(--eye-height);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 48% 52% 50% 50% / 47% 47% 53% 53%;
            background: radial-gradient(circle, #202020 0%, #090909 65%, #000 100%);
            box-shadow:
                0 0 120px rgba(255, 80, 0, 0.15),
                inset 0 0 120px rgba(255, 255, 255, 0.04);
        }

        .iris {
            position: relative;
            width: 70%;
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: 50%;
            background:
                radial-gradient(circle at 25% 35%, rgba(255, 255, 200, 0.17), transparent 15%),
                radial-gradient(circle at 70% 62%, rgba(50, 0, 0, 0.32), transparent 24%),
                radial-gradient(
                    circle,
                    #fff9a0 0%,
                    #ffd000 10%,
                    #ff8400 35%,
                    #d81a00 70%,
                    #240000 100%
                );
            box-shadow:
                0 0 40px #ff6600,
                0 0 120px #661100;
            transition: filter 4s ease;
        }

        .eye.closing .iris,
        .eye.drowsy .iris {
            filter: brightness(0.91) saturate(0.95);
        }

        .iris::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            border-radius: 50%;
            background:
                repeating-conic-gradient(
                    from 2deg,
                    rgba(0, 0, 0, 0.28) 0deg,
                    rgba(0, 0, 0, 0.28) 0.8deg,
                    transparent 0.8deg,
                    transparent 3.7deg
                ),
                repeating-conic-gradient(
                    from 17deg,
                    transparent 0deg,
                    transparent 6deg,
                    rgba(255, 220, 80, 0.13) 6deg,
                    rgba(255, 220, 80, 0.13) 7deg,
                    transparent 7deg,
                    transparent 13deg
                ),
                radial-gradient(circle at 25% 35%, rgba(255,255,255,0.18), transparent 18%),
                radial-gradient(circle at 72% 58%, rgba(0,0,0,0.25), transparent 22%),
                radial-gradient(circle at 52% 78%, rgba(255,255,255,0.12), transparent 14%);
            mix-blend-mode: multiply;
            opacity: 0.9;
            pointer-events: none;
        }

        .pupil-track {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.22, 0.7, 0.32, 1);
            will-change: transform;
        }

        .pupil {
            width: 14%;
            height: 68%;
            background: linear-gradient(to right, #000, #111, #000);
            transition:
                width 0.72s cubic-bezier(0.22, 0.7, 0.32, 1),
                filter 0.72s ease;
            filter: drop-shadow(0 0 10px rgba(255, 80, 0, 0.5));
            clip-path: polygon(
                50% 0%, 62% 8%, 80% 35%, 100% 50%, 80% 65%, 62% 92%,
                50% 100%, 39% 90%, 20% 65%, 0 50%, 20% 35%, 39% 10%
            );
        }

        .eye.natural-focus .pupil {
            width: 11.5%;
        }

        .eye.focus-stare .pupil {
            width: 8.5%;
            filter: drop-shadow(0 0 13px rgba(255, 90, 0, 0.66));
        }

        .eye.focus-stare .iris {
            filter: brightness(1.05) saturate(1.05) contrast(1.03);
        }

        .eye.focusing .pupil {
            width: 7%;
            filter:
                drop-shadow(0 0 14px rgba(255, 90, 0, 0.72));
        }

        .eye.focusing .iris {
            filter:
                brightness(1.08)
                saturate(1.08)
                contrast(1.04);
        }

        .cornea {
            position: absolute;
            inset: 0;
            z-index: 4;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(
                circle at 35% 24%,
                rgba(255, 255, 255, 0.10),
                transparent 42%
            );
        }

        .cornea::before {
            content: "";
            position: absolute;
            top: 8%;
            right: 12%;
            width: 22%;
            height: 32%;
            border-radius: 50%;
            background: radial-gradient(
                ellipse,
                rgba(255, 255, 255, 0.98),
                rgba(255, 255, 255, 0.30),
                transparent 72%
            );
            filter: blur(5px);
        }

        .cornea::after {
            content: "";
            position: absolute;
            top: 30%;
            left: 28%;
            width: clamp(10px, 1.25vmin, 18px);
            height: clamp(10px, 1.25vmin, 18px);
            border-radius: 50%;
            background: #fff;
            opacity: 0.8;
            filter: blur(2px);
        }

        .lid-shadow {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            width: 100%;
            height: 22%;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95), transparent);
        }

        .sleep-upper,
        .sleep-lower {
            position: absolute;
            left: 0;
            z-index: 20;
            width: 100%;
            height: 55%;
            pointer-events: none;
            background:
                radial-gradient(
                    ellipse at 28% 34%,
                    rgba(110, 28, 15, 0.15) 0%,
                    transparent 28%
                ),
                radial-gradient(
                    ellipse at 72% 58%,
                    rgba(70, 12, 8, 0.12) 0%,
                    transparent 32%
                ),
                repeating-linear-gradient(
                    3deg,
                    rgba(255, 220, 200, 0.018) 0px,
                    transparent 3px,
                    transparent 12px
                ),
                repeating-linear-gradient(
                    92deg,
                    transparent 0,
                    rgba(255, 255, 255, 0.018) 7px,
                    transparent 23px
                ),
                linear-gradient(
                    to bottom,
                    rgba(28, 6, 4, 0.99) 0%,
                    rgba(13, 3, 2, 0.99) 38%,
                    #010000 100%
                );
            box-shadow:
                inset 0 -16px 28px rgba(0, 0, 0, 0.46),
                inset 0 8px 16px rgba(255, 100, 55, 0.055);
            will-change: top, bottom, border-radius;
        }

        .sleep-upper {
            top: -55%;
            border-bottom-left-radius: 50% 100%;
            border-bottom-right-radius: 50% 100%;
        }

        .sleep-upper::after {
            content: "";
            position: absolute;
            left: 9%;
            bottom: 14%;
            width: 82%;
            height: 3px;
            border-radius: 50%;
            background: rgba(255, 210, 190, 0.055);
            filter: blur(2px);
        }

        .sleep-lower::after {
            content: "";
            position: absolute;
            left: 13%;
            top: 17%;
            width: 74%;
            height: 2px;
            border-radius: 50%;
            background: rgba(255, 190, 165, 0.038);
            filter: blur(2px);
        }

        .sleep-lower {
            bottom: -55%;
            border-top-left-radius: 50% 100%;
            border-top-right-radius: 50% 100%;
            background:
                linear-gradient(
                    to top,
                    rgba(18, 4, 3, 0.98) 0%,
                    rgba(8, 1, 1, 0.99) 42%,
                    #010000 100%
                ),
                repeating-linear-gradient(
                    88deg,
                    transparent 0,
                    rgba(255, 255, 255, 0.012) 8px,
                    transparent 25px
                );
            box-shadow: inset 0 14px 28px rgba(0, 0, 0, 0.48);
        }

        .eye.drowsy .sleep-upper {
            border-bottom-left-radius: 34% 30%;
            border-bottom-right-radius: 34% 30%;
        }

        .eye.drowsy .sleep-lower {
            border-top-left-radius: 38% 34%;
            border-top-right-radius: 38% 34%;
        }

        .eye.closing .sleep-upper {
            border-bottom-left-radius: 25% 16%;
            border-bottom-right-radius: 25% 16%;
        }

        .eye.closing .sleep-lower {
            border-top-left-radius: 28% 18%;
            border-top-right-radius: 28% 18%;
        }

        @keyframes fog-one {
            50% { transform: translateX(-180px); }
        }

        @keyframes fog-two {
            50% { transform: translate(140px, -40px); }
        }

        @keyframes fog-three {
            50% { transform: scale(1.05); }
        }
    </style>
</head>

<body>
    <!-- Hidden Camera Window -->
    <video id="camera"
            autoplay
            playsinline
            muted
            style="display: none;">
    </video>

    <canvas id="vision"
            width="320"
            height="240"
            style ="display: none;">
    </canvas>

    <div class="fog"></div>
    <div class="fog2"></div>
    <div class="fog3"></div>
    <div id="embers"></div>

    <div class="eye" id="eye">
        <div class="lid-shadow"></div>

        <div class="iris" id="iris">
            <div class="pupil-track" id="pupilTrack">
                <div class="pupil"></div>
            </div>
            <div class="cornea"></div>
        </div>

        <div class="sleep-upper" id="sleepUpper"></div>
        <div class="sleep-lower" id="sleepLower"></div>
    </div>

    <script>
        document.addEventListener("click", async () => {

                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                }
            },
            { once: true }
        );

        // DOM references used throughout the animation.
        const camera = document.getElementById("camera");
        const canvas = document.getElementById("vision");
        const canvasContext = canvas.getContext("2d", {
            willReadFrequently: true
        });
        const eye = document.getElementById("eye");
        const iris = document.getElementById("iris");
        const pupilTrack = document.getElementById("pupilTrack");
        const upper = document.getElementById("sleepUpper");
        const lower = document.getElementById("sleepLower");
        const embers = document.getElementById("embers");
        
        // A higher value makes motion tracking less sensitive.
        const motionThreshold = 50;
        const movementTrigger = 100;
        const motionLockTime = 5000;
        const requiredStableFrames = 2;
        const drowsyTimers = [];

        const zoneTargets = {
            topLeft:      { x: 0.7,  y: -0.6 },
            topCenter:    { x: 0.0,  y: -0.6 },
            topRight:     { x: -0.7, y: -0.6 },

            middleLeft:   { x: 0.7,  y: 0.0 },
            middleCentre: { x: 0.0,  y: 0.0 },
            middleRight:  { x: -0.7, y: 0.0 },

            bottomLeft:   { x: 0.7,  y: 0.6 },
            bottomCentre: { x: 0.0,  y: 0.6 },
            bottomRight:  { x: -0.7, y: 0.6 }
        };

        let sleeping = false;
        let drowsy = false;
        let asleep = false;
        let sleepFlickerTimer = null;
        let sleepReactionCount = 0;
        let sleepReactionLimit = 1;
        let focusStareActive = false;
        let previousFrame = null;
        let motionTarget = null;
        let motionTrackingEnabled = true;
        let lastMotionTime = 0;
        let pendingMotionZone = null;
        let pendingMotionFrames = 0;


        function supportsCamera() {
            const supported = Boolean(
                window.isSecureContext &&
                navigator.mediaDevices &&
                navigator.mediaDevices.getUserMedia
            );

            motionTrackingEnabled = supported;
            return supported;
        }

        console.log(
            "Camera Support:",
            supportsCamera()
        );

        async function countCameras() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const cameras = devices.filter(
                device => device.kind === "videoinput"
            );

            return cameras.length;
        }

        async function initialiseCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: "user" },
                        width: { ideal: 320, max: 640 },
                        height: { ideal: 240, max: 480 },
                        frameRate: { ideal: 15, max: 30 }
                    },
                    audio: false
                });

                camera.srcObject = stream;

                console.log("Video Play: Requested");
                console.log("Camera Access: Granted");
                console.log("Video Stream: Attached");

                camera.onloadedmetadata = () => {
                    console.log(
                        "Camera Resolution:",
                        camera.videoWidth,
                        "x",
                        camera.videoHeight
                    );
                };

                camera.addEventListener("loadeddata", () => {
                    console.log(
                        "Camera Stream: Active"
                    );
                    console.log(
                        "Active Resolution:",
                        camera.videoWidth,
                        "x",
                        camera.videoHeight
                    );
                    setInterval(detectMovement, 250);
                });

                await camera.play();
            } catch (error) {
                motionTrackingEnabled = false;
                console.log(
                    "Camera Access: Unavailable"
                );

                console.log(error);
            }
        }

        function drawGrid() {
            const width = canvas.width;
            const height = canvas.height;
            const thirdWidth = width / 3;
            const thirdHeight = height / 3;

            canvasContext.strokeStyle = "lime";
            canvasContext.lineWidth = 2;

            // Left divider.
            canvasContext.beginPath();
            canvasContext.moveTo(thirdWidth, 0);
            canvasContext.lineTo(thirdWidth, height);
            canvasContext.stroke();

            // Right divider.
            canvasContext.beginPath();
            canvasContext.moveTo(thirdWidth * 2, 0);
            canvasContext.lineTo(thirdWidth * 2, height);
            canvasContext.stroke();

            // Top divider.
            canvasContext.beginPath();
            canvasContext.moveTo(0, thirdHeight);
            canvasContext.lineTo(width, thirdHeight);
            canvasContext.stroke();

            // Bottom divider.
            canvasContext.beginPath();
            canvasContext.moveTo(0, thirdHeight * 2);
            canvasContext.lineTo(width, thirdHeight * 2);
            canvasContext.stroke();
        }

        function captureFrame() {
            canvasContext.drawImage(camera, 0, 0, canvas.width, canvas.height);
        }

        function getFrameData() {
            const imageData = canvasContext.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );

            return imageData.data;
        }

        function detectMovement() {
            /*
             * Compare the current camera frame against the previous frame.
             * Significant pixel changes are counted by screen zone so the eye
             * can determine where movement occurred.
             */

            const eyeIsTransitioning = eye.classList.contains("drowsy") ||
                eye.classList.contains("closing");

            if (!motionTrackingEnabled || eyeIsTransitioning || focusStareActive) {
                previousFrame = null;
                pendingMotionZone = null;
                pendingMotionFrames = 0;
                return;
            }

            captureFrame();

            const currentFrame = getFrameData();
            const sectionWidth = canvas.width / 3;
            const sectionHeight = canvas.height / 3;

            drawGrid();

            if (!previousFrame) {
                previousFrame = currentFrame.slice();

                console.log("Initial Frame Stored: Success");

                return;
            }

            let changedPixels = 0;
            const zones = {
                topLeft: 0,
                topCenter: 0,
                topRight: 0,

                middleLeft: 0,
                middleCentre: 0,
                middleRight: 0,

                bottomLeft: 0,
                bottomCentre: 0,
                bottomRight: 0
            };



            for (
                let i = 0;
                i < currentFrame.length;
                i += 4
            ) {
                const difference = Math.abs(
                    currentFrame[i] - previousFrame[i]
                );

                if (difference > motionThreshold) {
                    changedPixels++;

                    const pixelNumber = i / 4;
                    const x = pixelNumber % canvas.width;

                    const y = Math.floor(
                        pixelNumber / canvas.width
                    );


                    if (x < sectionWidth && y < sectionHeight) {
                        zones.topLeft++;
                    } else if (x > sectionWidth && x < (sectionWidth * 2) && y < sectionHeight) {
                        zones.topCenter++;
                    } else if (x > (sectionWidth * 2) && y < sectionHeight) {
                        zones.topRight++;
                    } else if (x < sectionWidth && y > sectionHeight && y < (sectionHeight * 2)) {
                        zones.middleLeft++;
                    } else if (x > sectionWidth && x < (sectionWidth * 2) && y > sectionHeight && y < (sectionHeight * 2)) {
                        zones.middleCentre++;
                    } else if (x > (sectionWidth * 2) && y > sectionHeight && y < (sectionHeight * 2)) {
                        zones.middleRight++;
                    } else if (x < sectionWidth && y > (sectionHeight * 2)) {
                        zones.bottomLeft++;
                    } else if (x > sectionWidth && x < (sectionWidth * 2) && y > (sectionHeight * 2)) {
                        zones.bottomCentre++;
                    } else if (x > (sectionWidth * 2) && y > (sectionHeight * 2)) {
                        zones.bottomRight++;
                    }
                    
                }
            }

            let winningZone = null;
            let highestCount = 0;

            for (const zone in zones) {
                if (zones[zone] > highestCount) {
                    highestCount = zones[zone];
                    winningZone = zone;
                }
            }

            if (winningZone && highestCount > movementTrigger) {
                pendingMotionFrames = winningZone === pendingMotionZone
                    ? pendingMotionFrames + 1
                    : 1;
                pendingMotionZone = winningZone;

                if (
                    pendingMotionFrames >= requiredStableFrames &&
                    Date.now() - lastMotionTime >= motionLockTime
                ) {
                    motionTarget = zoneTargets[winningZone];
                    lastMotionTime = Date.now();
                    setPupilPosition(motionTarget);
                    pendingMotionZone = null;
                    pendingMotionFrames = 0;
                }
            } else {
                pendingMotionZone = null;
                pendingMotionFrames = 0;
            }

            previousFrame = currentFrame.slice();
        }

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function later(callback, delay) {
            const timer = setTimeout(callback, delay);
            drowsyTimers.push(timer);
            return timer;
        }

        const gazePositions = [
            { x: 0.00, y: 0.12 },
            { x: -1.00, y: 0.10 },
            { x: 1.00, y: 0.10 },
            { x: -0.82, y: 0.42 },
            { x: 0.82, y: 0.42 },
            { x: -0.72, y: 0.68 },
            { x: 0.72, y: 0.68 },
            { x: 0.00, y: 0.52 },
            { x: 0.00, y: 0.82 }
        ];

        function setPupilPosition(position, immediate = false) {
            const maximumX = iris.clientWidth * 0.25;
            const maximumY = iris.clientHeight * 0.15;
            const x = position.x * maximumX;
            const y = position.y * maximumY;

            if (immediate) {
                const previousTransition = pupilTrack.style.transition;
                pupilTrack.style.transition = "none";
                pupilTrack.style.transform = `translate3d(${x}px, ${y}px, 0)`;
                void pupilTrack.offsetHeight;
                pupilTrack.style.transition = previousTransition;
                return;
            }

            pupilTrack.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        }

        function movePupil() {
            if (Date.now() - lastMotionTime < motionLockTime) {
                setTimeout(movePupil, 500);
                return;
            }

            if (motionTarget) {
                setPupilPosition(motionTarget);
                motionTarget = null;

                setTimeout(movePupil, random(3500, 8500));
                return;
            }

            if (!sleeping && !drowsy && !focusStareActive) {
                const position = Math.random() < 0.18
                    ? { x: 0, y: 0.12 }
                    : gazePositions[Math.floor(Math.random() * gazePositions.length)];

                setPupilPosition(position);

                /*
                   A small, irregular contraction accompanies some
                   ordinary gaze changes. It is deliberately subtle.
                */
                eye.classList.remove("natural-focus");

                if (Math.random() < 0.48) {
                    setTimeout(() => {
                        if (!sleeping && !drowsy && !focusStareActive) {
                            eye.classList.add("natural-focus");
                        }
                    }, random(500, 1100));

                    setTimeout(() => {
                        eye.classList.remove("natural-focus");
                    }, random(1900, 3300));
                }

                if (Math.random() < 0.30) {
                    setTimeout(() => {
                        if (!sleeping && !drowsy && !focusStareActive) {
                            setPupilPosition({
                                x: Math.max(-1, Math.min(1, position.x + random(-0.14, 0.14))),
                                y: Math.max(0.08, Math.min(0.82, position.y + random(-0.07, 0.09)))
                            });
                        }
                    }, random(1300, 2100));
                }
            }

            setTimeout(movePupil, random(3500, 8500));
        }

        function scheduleFocusStare() {
            setTimeout(() => {
                performFocusStare();
                scheduleFocusStare();
            }, random(18000, 42000));
        }

        function performFocusStare() {
            if (sleeping || drowsy || asleep || focusStareActive) {
                return;
            }

            focusStareActive = true;
            eye.classList.remove("natural-focus");
            eye.classList.add("focus-stare");

            setPupilPosition({
                x: random(-0.65, 0.65),
                y: random(0.22, 0.62)
            });

            /* Eyelids narrow only slightly, like a deliberate squint. */
            setLidTransitions(
                "top 1.1s ease-in-out, border-radius 1.1s ease-in-out",
                "bottom 1.35s ease-in-out, border-radius 1.35s ease-in-out"
            );

            upper.style.top = "-43%";
            lower.style.bottom = "-48%";

            const hold = random(3200, 5600);

            setTimeout(() => {
                eye.classList.remove("focus-stare");

                setLidTransitions(
                    "top 1.2s ease-in-out, border-radius 1.2s ease-in-out",
                    "bottom 1.45s ease-in-out, border-radius 1.45s ease-in-out"
                );

                upper.style.top = "-55%";
                lower.style.bottom = "-55%";

                setTimeout(() => {
                    focusStareActive = false;
                }, 1500);
            }, hold);
        }

        function setLidTransitions(upperTransition, lowerTransition) {
            upper.style.transition = upperTransition;
            lower.style.transition = lowerTransition;
        }

        function useBlinkTransitions() {
            setLidTransitions(
                "top 0.24s ease-out, border-radius 0.24s ease-out",
                "bottom 0.34s ease-out, border-radius 0.34s ease-out"
            );
        }

        function useDrowsyTransitions(duration = 2.8) {
            setLidTransitions(
                `top ${duration}s cubic-bezier(0.36, 0, 0.28, 1), border-radius ${duration}s ease`,
                `bottom ${duration + 0.45}s cubic-bezier(0.36, 0, 0.28, 1), border-radius ${duration + 0.45}s ease`
            );
        }

        function useSleepTransitions() {
            setLidTransitions(
                "top 12s cubic-bezier(0.42, 0, 0.34, 1), border-radius 12s ease-in-out",
                "bottom 15s cubic-bezier(0.42, 0, 0.34, 1), border-radius 15s ease-in-out"
            );
        }

        function useWakeTransitions() {
            setLidTransitions(
                "top 7s ease-in-out, border-radius 7s ease-in-out",
                "bottom 9s ease-in-out, border-radius 9s ease-in-out"
            );
        }

        function scheduleSleepFlicker() {
            clearTimeout(sleepFlickerTimer);

            if (!asleep || sleepReactionCount >= sleepReactionLimit) {
                return;
            }

            sleepFlickerTimer = setTimeout(() => {
                if (!asleep || sleepReactionCount >= sleepReactionLimit) {
                    return;
                }

                sleepReactionCount += 1;
                performSleepReaction();

                if (sleepReactionCount < sleepReactionLimit) {
                    scheduleSleepFlicker();
                }
            }, random(7000, 17000));
        }

        function performSleepReaction() {
            const strongerReaction = Math.random() < 0.35;

            setLidTransitions(
                "top 0.48s cubic-bezier(0.2, 0.8, 0.3, 1), border-radius 0.48s ease-out",
                "bottom 0.64s cubic-bezier(0.2, 0.8, 0.3, 1), border-radius 0.64s ease-out"
            );

            eye.classList.remove("closing");
            eye.classList.add("drowsy");

            upper.style.top = strongerReaction ? "-36%" : "-30%";
            lower.style.bottom = strongerReaction ? "-24%" : "-19%";

            setPupilPosition({
                x: random(-0.24, 0.24),
                y: strongerReaction ? 0.20 : 0.27
            });

            setTimeout(() => {
                if (asleep) {
                    eye.classList.add("focusing");
                }
            }, 420);

            const listeningPause = strongerReaction
                ? random(2100, 3000)
                : random(1600, 2300);

            setTimeout(() => {
                if (!asleep) {
                    return;
                }

                eye.classList.remove("focusing");
                eye.classList.remove("drowsy");
                eye.classList.add("closing");

                setLidTransitions(
                    "top 0.82s ease-in, border-radius 0.82s ease-in",
                    "bottom 1.0s ease-in, border-radius 1.0s ease-in"
                );

                upper.style.top = "0%";
                lower.style.bottom = "0%";
            }, listeningPause);
        }

        function blink() {
            if (sleeping || drowsy || focusStareActive) {
                setTimeout(blink, 5000);
                return;
            }

            useBlinkTransitions();
            eye.classList.add("drowsy");
            upper.style.top = "-30%";
            lower.style.bottom = "-37%";

            setTimeout(() => {
                setLidTransitions(
                    "top 0.38s ease-in, border-radius 0.38s ease-in",
                    "bottom 0.48s ease-in, border-radius 0.48s ease-in"
                );
                upper.style.top = "-55%";
                lower.style.bottom = "-55%";
            }, 240);

            setTimeout(() => {
                eye.classList.remove("drowsy");
            }, 780);

            setTimeout(blink, random(5000, 13000));
        }

        function startDrowsySequence() {
            sleeping = true;
            focusStareActive = false;
            eye.classList.remove("focus-stare", "natural-focus", "focusing");
            drowsy = true;
            eye.classList.add("drowsy");

            setPupilPosition({ x: 0.35, y: 0.28 });

            later(() => {
                useDrowsyTransitions(3.0);
                upper.style.top = "-40%";
                lower.style.bottom = "-49%";
            }, 1800);

            later(() => {
                useDrowsyTransitions(1.9);
                upper.style.top = "-55%";
                lower.style.bottom = "-55%";
                setPupilPosition({ x: -0.35, y: 0.34 });
            }, 5600);

            later(() => {
                useDrowsyTransitions(3.3);
                upper.style.top = "-31%";
                lower.style.bottom = "-44%";
                setPupilPosition({ x: 0.18, y: 0.52 });
            }, 9200);

            later(() => {
                useDrowsyTransitions(2.1);
                upper.style.top = "-50%";
                lower.style.bottom = "-53%";
                setPupilPosition({ x: 0, y: 0.68 });
            }, 13600);

                /*
                 * Final fight against sleep: nearly closes, catches himself,
                 * peeks open, watches once more, then finally gives in.
                 */
            later(() => {
                eye.classList.remove("drowsy");
                eye.classList.add("closing");

                setLidTransitions(
                    "top 5.8s cubic-bezier(0.42, 0, 0.38, 1), border-radius 5.8s ease-in-out",
                    "bottom 7s cubic-bezier(0.42, 0, 0.38, 1), border-radius 7s ease-in-out"
                );

                upper.style.top = "-8%";

                later(() => {
                    lower.style.bottom = "-12%";
                }, 1100);

                /* Just before fully closing, he forces the eye slightly open
                 * again for one last look.
                 */
                later(() => {
                    eye.classList.remove("closing");
                    eye.classList.add("drowsy");
                    useDrowsyTransitions(2.8);

                    upper.style.top = "-32%";
                    lower.style.bottom = "-43%";
                    setPupilPosition({ x: 0.42, y: 0.46 });
                }, 7600);

                /* Hold the reluctant half-open stare. */
                later(() => {
                    setPupilPosition({ x: -0.28, y: 0.58 });
                }, 10100);

                /* Final surrender to sleep. */
                later(() => {
                    eye.classList.remove("drowsy");
                    eye.classList.add("closing");
                    useSleepTransitions();

                    upper.style.top = "0%";

                    later(() => {
                        lower.style.bottom = "0%";
                    }, 1500);

                    later(() => {
                        asleep = true;
                        sleepReactionCount = 0;
                        sleepReactionLimit = Math.random() < 0.72 ? 1 : 2;
                        scheduleSleepFlicker();

                        const sleepDuration = random(30000, 60000);
                        later(wakeUp, sleepDuration);
                    }, 17000);
                }, 12600);
            }, 16800);
        }

        function sleepCycle() {
            startDrowsySequence();
            setTimeout(sleepCycle, random(210000, 330000));
        }

        function wakeUp() {
            asleep = false;
            focusStareActive = false;
            eye.classList.remove("focusing", "focus-stare", "natural-focus");
            clearTimeout(sleepFlickerTimer);

                /* Stage 1: a sleepy slit opens. The upper lid leads while the
                 * lower lid barely follows.
                 */
            eye.classList.remove("closing");
            eye.classList.add("drowsy");

            setLidTransitions(
                "top 3.8s cubic-bezier(0.32, 0, 0.28, 1), border-radius 3.8s ease-in-out",
                "bottom 4.8s cubic-bezier(0.32, 0, 0.28, 1), border-radius 4.8s ease-in-out"
            );

            upper.style.top = "-30%";
            lower.style.bottom = "-39%";
            setPupilPosition({ x: 0, y: 0.52 });

            /* Stage 2: briefly struggles and droops again. */
            setTimeout(() => {
                setLidTransitions(
                    "top 1.8s ease-in-out, border-radius 1.8s ease-in-out",
                    "bottom 2.2s ease-in-out, border-radius 2.2s ease-in-out"
                );

                upper.style.top = "-20%";
                lower.style.bottom = "-29%";
                setPupilPosition({ x: 0.18, y: 0.58 });
            }, 4800);

            /* Stage 3: gathers himself and opens properly. */
            setTimeout(() => {
                useWakeTransitions();

                upper.style.top = "-55%";

                setTimeout(() => {
                    lower.style.bottom = "-55%";
                }, 850);

                setPupilPosition({ x: -0.20, y: 0.34 });
            }, 7000);

            /* Stage 4: fully awake, still watching slightly downward. */
            setTimeout(() => {
                eye.classList.remove("drowsy", "closing");
                sleeping = false;
                drowsy = false;
                setPupilPosition({ x: 0, y: 0.18 });
            }, 18000);
        }

        function createEmber() {
            const ember = document.createElement("div");
            const size = random(1, 4);
            let x = random(0, window.innerWidth);
            let y = window.innerHeight + 20;
            const drift = random(-0.35, 0.35);
            const rise = random(0.55, 1.5);

            ember.style.cssText = `
                position: absolute;
                left: ${x}px;
                top: ${y}px;
                width: ${size}px;
                height: ${size}px;
                border-radius: 50%;
                background: ${Math.random() > 0.5 ? "#ff6600" : "#ffaa00"};
                box-shadow: 0 0 12px red;
                opacity: ${random(0.45, 0.95)};
            `;

            embers.appendChild(ember);

            const timer = setInterval(() => {
                y -= rise;
                x += drift + Math.sin(y / 55) * 0.12;
                ember.style.left = `${x}px`;
                ember.style.top = `${y}px`;

                if (y < -20) {
                    clearInterval(timer);
                    ember.remove();
                }
            }, 16);
        }

        countCameras().then(count => {
            console.log(
                "Camera Count:",
                count
             );
        });

        initialiseCamera();

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .then(() => console.log("PWA: Service worker registered"))
                    .catch(error => console.log("PWA: Service worker unavailable", error));
            });
        }

        setInterval(createEmber, 700);
        setPupilPosition({ x: 0, y: 0.12 }, true);
        movePupil();
        scheduleFocusStare();
        setTimeout(blink, 3000);
        setTimeout(sleepCycle, 60000);
    </script>
</body>
</html>
